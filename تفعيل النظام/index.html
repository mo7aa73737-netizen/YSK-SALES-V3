<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSK License Manager - إدارة التراخيص السحابية</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="نظام إدارة تراخيص YSK POS السحابي - إنشاء وإدارة والتحقق من أكواد التفعيل">
    <meta name="keywords" content="YSK, POS, License, تراخيص, نقاط البيع, تفعيل">
    <meta name="author" content="YSK Systems">
    
    <!-- PWA Theme -->
    <meta name="theme-color" content="#2563eb">
    <meta name="background-color" content="#ffffff">
    <meta name="display" content="standalone">
    <meta name="orientation" content="portrait">
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="YSK License Manager">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    
    <!-- Microsoft PWA Meta Tags -->
    <meta name="msapplication-TileColor" content="#2563eb">
    <meta name="msapplication-TileImage" content="./icons/icon-144x144.png">
    <meta name="msapplication-config" content="./browserconfig.xml">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16x16.png">
    <link rel="shortcut icon" href="./icons/icon-192x192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" as="style">
    <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
    
    <!-- Redirect to main app -->
    <meta http-equiv="refresh" content="0; url=./firebase-license-system.html">
    <link rel="canonical" href="./firebase-license-system.html">
    
    <style>
        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background-image: url('./YSK PHONE.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn {
            display: inline-block;
            background: white;
            color: #2563eb;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            margin: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
        }
        
        p {
            margin: 0 0 20px 0;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .features {
            text-align: right;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .features h3 {
            margin: 0 0 15px 0;
            font-size: 18px;
        }
        
        .features ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .features li {
            padding: 5px 0;
            position: relative;
            padding-right: 20px;
        }
        
        .features li:before {
            content: '✓';
            position: absolute;
            right: 0;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">YSK</div>
        <h1>YSK License Manager</h1>
        <p>نظام إدارة التراخيص السحابية</p>
        
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
        
        <div class="features">
            <h3>المميزات:</h3>
            <ul>
                <li>إنشاء أكواد تفعيل فورية</li>
                <li>إدارة شاملة للتراخيص</li>
                <li>التحقق من صحة الأكواد</li>
                <li>واجهة سهلة الاستخدام</li>
                <li>يعمل بدون إنترنت (PWA)</li>
                <li>متوافق مع جميع الأجهزة</li>
            </ul>
        </div>
        
        <a href="./firebase-license-system.html" class="btn">دخول التطبيق</a>
        <a href="./generate-icons.html" class="btn">مولد الأيقونات</a>
    </div>

    <script>
        // Redirect to main app after 2 seconds
        setTimeout(() => {
            window.location.href = './firebase-license-system.html';
        }, 2000);
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        // PWA install prompt
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Show install button
            const installBtn = document.createElement('button');
            installBtn.textContent = 'تثبيت التطبيق';
            installBtn.className = 'btn';
            installBtn.style.background = '#4ade80';
            installBtn.style.color = 'white';
            
            installBtn.addEventListener('click', () => {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                    installBtn.remove();
                });
            });
            
            document.querySelector('.container').appendChild(installBtn);
        });
    </script>
</body>
</html>
