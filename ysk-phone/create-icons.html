<!DOCTYPE html>
<html>
<head>
    <title>إنشاء أيقونات YSK Products</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        button { padding: 10px 20px; margin: 10px; background: #1f2937; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #374151; }
    </style>
</head>
<body>
    <h1>إنشاء أيقونات YSK Products</h1>
    
    <canvas id="canvas192" width="192" height="192"></canvas>
    <canvas id="canvas512" width="512" height="512"></canvas>
    
    <br>
    <button onclick="generateIcons()">إنشاء الأيقونات</button>
    <button onclick="downloadIcon(192)">تحميل 192x192</button>
    <button onclick="downloadIcon(512)">تحميل 512x512</button>

    <script>
        function createIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#1f2937');
            gradient.addColorStop(1, '#374151');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Add rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.1);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';

            // Icon - Package/Box
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.02;
            
            const centerX = size / 2;
            const centerY = size / 2;
            const boxSize = size * 0.4;
            
            // Draw box
            ctx.beginPath();
            ctx.rect(centerX - boxSize/2, centerY - boxSize/2, boxSize, boxSize);
            ctx.stroke();
            
            // Draw box top
            ctx.beginPath();
            ctx.moveTo(centerX - boxSize/2, centerY - boxSize/2);
            ctx.lineTo(centerX, centerY - boxSize/2 - boxSize/4);
            ctx.lineTo(centerX + boxSize/2, centerY - boxSize/2);
            ctx.stroke();
            
            // Draw box side
            ctx.beginPath();
            ctx.moveTo(centerX + boxSize/2, centerY - boxSize/2);
            ctx.lineTo(centerX + boxSize/2 + boxSize/4, centerY);
            ctx.lineTo(centerX + boxSize/2 + boxSize/4, centerY + boxSize/2);
            ctx.lineTo(centerX + boxSize/2, centerY + boxSize/2);
            ctx.stroke();
            
            // Draw center line
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - boxSize/2 - boxSize/4);
            ctx.lineTo(centerX, centerY + boxSize/2);
            ctx.stroke();
            
            // Add text
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.08}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('YSK', centerX, centerY + boxSize/2 + size * 0.1);
        }

        function generateIcons() {
            createIcon(192);
            createIcon(512);
        }

        function downloadIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generate icons on page load
        window.onload = generateIcons;
    </script>
</body>
</html>
